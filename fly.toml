# fly.toml - AutoFlow deployment config for Fly.io free tier
# Deploy: fly launch (first time) -> fly deploy

app = "autoflow-veiculos"
primary_region = "gru"  # São Paulo - closest to Brazil

[build]
  dockerfile = "Dockerfile"

[env]
  RACK_ENV = "production"
  PORT = "8080"
  DATABASE_PATH = "/data/garagem.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/veiculos"
    timeout = "5s"

[mounts]
  source = "autoflow_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1